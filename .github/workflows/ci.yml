name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - '20'
          - '22'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate MCP Registry metadata
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run registry:validate

      - name: Verify release hygiene
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run release:verify

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.node-version != '22'
        run: npm run test:run

      - name: Run tests with coverage thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Validate Core Reset evidence contract
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npx vitest run tests/unit/core-reset-baseline.test.ts

      - name: Verify checkout and packed retrieval parity
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run verify:pack-parity

      - name: Security audit
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm audit --audit-level=high

      - name: Generate demo graph for eval regression
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: node dist/src/adapters/cli/bin.js generate examples/demo-repo

      - name: Enforce eval regression thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: node .github/scripts/ci-eval-regression.mjs

      - name: Validate npm package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
        run: node tools/eval/core-reset/verify-isolation.mjs
