name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - '20'
          - '22'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate MCP Registry metadata
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run registry:validate

      - name: Verify release hygiene
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run release:verify

      # Runs on every lane on purpose. The qualification freeze is a byte-exact
      # guarantee, so it has to be verified on every platform the repository
      # supports — a reproducible gate that only reproduces on Linux is not one.
      # The default mode is pure local file I/O with no network and no spend.
      - name: Validate qualification contract
        run: npm run qualify:validate

      - name: Typecheck
        run: npm run typecheck

      # #660-A. Runs on every lane on purpose: grader/runtime separation is a
      # structural property of the module graph, and a boundary that only holds
      # on one platform is not a boundary. The self-test injects a real grader
      # dependency into real production files, requires the exact rejection
      # reason, then restores the bytes and proves they went back -- so the
      # check is falsifiable rather than merely green. Pure local file I/O,
      # no network and no spend.
      - name: Verify grader/runtime structural boundary
        run: npm run verify:grader-boundary-controls

      # The old-reader proof extracts the released v0.32.1 loader from the
      # in-repository tag. The default shallow checkout carries no tags, so the
      # proof cannot run without this. One pinned ref is fetched, not full
      # history, and a tag resolving to any other commit fails the lane.
      - name: Provision the pinned v0.32.1 compatibility ref
        run: node .github/scripts/ensure-v0321-compat-ref.mjs

      # The actual-byte compatibility proof does not approximate the pre-#658
      # reader, it compiles and runs the source that stood at 31ad2168, and the
      # writer that stood at 580f59f6. The default shallow checkout carries
      # neither commit, so `git show <commit>:<path>` fails and every
      # history-dependent control in that suite fails with it. Two exact commits
      # are fetched, not the repository's history, and a commit whose entry
      # blobs differ fails the lane.
      - name: Provision the pinned #658 compatibility refs
        run: node .github/scripts/ensure-658-compat-refs.mjs

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.node-version != '22'
        env:
          VITEST_GUARD_LOG_PATH: ${{ runner.temp }}/vitest-guard-test-run-${{ matrix.os }}-node${{ matrix.node-version }}.log
        run: npm run test:run

      - name: Run tests with coverage thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        env:
          VITEST_GUARD_LOG_PATH: ${{ runner.temp }}/vitest-guard-test-coverage-${{ matrix.os }}-node${{ matrix.node-version }}.log
        run: npm run test:coverage

      - name: Upload raw vitest logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-guard-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-node${{ matrix.node-version }}
          path: |
            ${{ runner.temp }}/vitest-guard-test-run-${{ matrix.os }}-node${{ matrix.node-version }}.log
            ${{ runner.temp }}/vitest-guard-test-coverage-${{ matrix.os }}-node${{ matrix.node-version }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Verify checkout and packed retrieval parity
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm run verify:pack-parity

      - name: Security audit
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: npm audit --audit-level=high

      - name: Generate demo graph for eval regression
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        run: node dist/src/cli/bin.js generate examples/demo-repo --no-html

      - name: Enforce eval regression thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        shell: bash
        run: |
          set -euo pipefail
          runner_template='node .github/scripts/ci-prompt-runner.mjs --prompt {prompt_file} --output {output_file} --question {question} --mode {mode}'
          output="$(node dist/src/cli/bin.js eval examples/demo-repo/out/graph.madar --questions examples/demo-repo/benchmark-questions.json --exec "$runner_template" --yes)"
          printf '%s\n' "$output"

          recall="$(printf '%s\n' "$output" | awk '/Recall:/ { gsub("%", "", $2); print $2 }')"
          mrr="$(printf '%s\n' "$output" | awk '/MRR:/ { print $2 }')"
          snippet_coverage="$(printf '%s\n' "$output" | awk '/Snippet coverage:/ { gsub("%", "", $3); print $3 }')"
          grounded_match_rate="$(printf '%s\n' "$output" | awk '/Grounded match rate:/ { gsub("%", "", $4); print $4 }')"

          # The demo-repo eval fixture currently measures 92% recall on this branch.
          # Keep the workflow floor aligned with the documented benchmark/report gate
          # until a stronger real-repo eval threshold replaces the fixture baseline.
          node -e "const recall = Number(process.argv[1]); const mrr = Number(process.argv[2]); const snippetCoverage = Number(process.argv[3]); if (!Number.isFinite(recall) || recall < 90 || !Number.isFinite(mrr) || mrr < 0.95 || !Number.isFinite(snippetCoverage) || snippetCoverage < 95) { console.error('eval thresholds failed: recall=' + recall + ', mrr=' + mrr + ', snippet_coverage=' + snippetCoverage); process.exit(1) }" "$recall" "$mrr" "$snippet_coverage"
          if [ -n "$grounded_match_rate" ]; then
            echo "::notice title=Eval grounded match rate::${grounded_match_rate}% (report-only for now)"
          fi

      - name: Validate npm package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
        run: npm pack --dry-run
