name: Publish next prerelease

# Triggers only on an approved prerelease tag push. There is no workflow_dispatch: this
# workflow lives on `next`, the repository default branch is `main`, and a dispatch trigger
# defined on a non-default branch cannot be invoked from the Actions UI in the first place --
# it would be a dead, misleading control surface. Retrying a failed run uses GitHub's own
# rerun-failed-jobs control (see the `post_publish` job below for why that is safe).
on:
  push:
    tags:
      - 'v*-beta.*'
      - 'v*-rc.*'
      - 'v*-next.*'

# No workflow-level `contents: write` or `id-token: write`. Every job declares the minimum
# permissions it needs for itself; nothing here is inherited broadly.
permissions:
  contents: read

concurrency:
  group: publish-next
  cancel-in-progress: false

jobs:
  # Builds, tests, and packs the release candidate. Holds no publish credentials of any kind
  # (no `id-token`, no environment), so it is safe for this job to run the full test suite,
  # the build, and every repository script.
  validate:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PACKAGE_NAME: '@lubab/madar'
      RELEASE_TAG: ${{ github.ref_name }}

    outputs:
      version: ${{ steps.release-meta.outputs.version }}
      commit: ${{ steps.release-commit.outputs.commit }}
      tag: ${{ steps.release-meta.outputs.tag }}
      tarball_name: ${{ steps.pack.outputs.tarball }}
      tarball_sha256: ${{ steps.pack.outputs.sha256 }}
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      qualification_status: ${{ steps.qualification.outputs.status }}

    steps:
      - name: Check out exact prerelease commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Never restore setup-node's npm cache in a release-pipeline job: an untrusted
      # pull-request job could poison a shared cache that later executes here.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pinned npm Trusted Publishing client
        run: npm install --global --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/npm-cli-bootstrap-cache" npm@12.0.2

      # Stable id so the job `outputs:` block can map version/tag from `steps.release-meta.
      # outputs.*` instead of `env.*`. Values written at runtime via `>> "$GITHUB_ENV"` do not
      # reliably populate `jobs.<id>.outputs`, so those two paths are kept for different
      # purposes here: `$GITHUB_ENV` for later steps in this same job, `$GITHUB_OUTPUT` for the
      # job-level output other jobs consume through `needs.validate.outputs`.
      - name: Validate prerelease tag and release files
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/verify-next-release-state.mjs \
            --assert-event \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF"
          node .github/scripts/classify-release-tag.mjs \
            --tag "$RELEASE_TAG" \
            --expect prerelease \
            --verify-package-version \
            --verify-changelog

          version="${RELEASE_TAG#v}"
          printf 'PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          {
            echo "version=$version"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      # Stable id so `outputs.commit` maps from `steps.release-commit.outputs.commit` -- see the
      # note on the `release-meta` step above for why this must not be `env.RELEASE_COMMIT`.
      - name: Prove exact tag commit and next ancestry
        id: release-commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/next:refs/remotes/origin/next

          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "::error::Checked out commit $head_commit does not match $RELEASE_TAG at $tag_commit"
            exit 1
          fi
          if [[ "$head_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::The workflow event commit $GITHUB_SHA is not the tagged commit $head_commit."
            exit 1
          fi

          node .github/scripts/verify-next-release-state.mjs \
            --assert-ancestor \
            --commit "$head_commit" \
            --branch origin/next
          printf 'RELEASE_COMMIT=%s\n' "$head_commit" >> "$GITHUB_ENV"
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"

      - name: Verify version is not already published
        shell: bash
        run: |
          set -euo pipefail
          npm view "$PACKAGE_NAME" versions --json > "$RUNNER_TEMP/npm-published-versions.json"
          node .github/scripts/verify-next-release-state.mjs \
            --assert-unpublished \
            --version "$PACKAGE_VERSION" \
            --versions-file "$RUNNER_TEMP/npm-published-versions.json"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A green vitest summary is not sufficient release evidence on its own: the forks pool
      # (maxWorkers: 4, no retry configured) can respawn a worker mid-run when one fails to
      # start or stops responding, and the run's own tally can still count the respawned
      # worker's files as passed. Capture the raw output, then scan the raw text independently
      # of vitest's own exit code and summary. `set -e` is deliberately off in this step so a
      # non-zero `test:run` exit does not short-circuit before the scanner runs: both statuses
      # are captured explicitly and the step fails if either one is non-zero.
      - name: Run tests
        shell: bash
        run: |
          set +e
          set -u
          set -o pipefail
          npm run test:run 2>&1 | tee "$RUNNER_TEMP/test-run.log"
          test_status=${PIPESTATUS[0]}

          node .github/scripts/assert-clean-vitest-log.mjs "$RUNNER_TEMP/test-run.log"
          scanner_status=$?

          if [ "$test_status" -ne 0 ]; then
            echo "::error::npm run test:run exited $test_status"
          fi
          if [ "$scanner_status" -ne 0 ]; then
            echo "::error::vitest log scan detected an absorbed worker-start failure signature in test-run.log"
          fi
          if [ "$test_status" -ne 0 ] || [ "$scanner_status" -ne 0 ]; then
            exit 1
          fi

      - name: Run tests with coverage thresholds
        shell: bash
        run: |
          set +e
          set -u
          set -o pipefail
          npm run test:coverage 2>&1 | tee "$RUNNER_TEMP/test-coverage.log"
          test_status=${PIPESTATUS[0]}

          node .github/scripts/assert-clean-vitest-log.mjs "$RUNNER_TEMP/test-coverage.log"
          scanner_status=$?

          if [ "$test_status" -ne 0 ]; then
            echo "::error::npm run test:coverage exited $test_status"
          fi
          if [ "$scanner_status" -ne 0 ]; then
            echo "::error::vitest log scan detected an absorbed worker-start failure signature in test-coverage.log"
          fi
          if [ "$test_status" -ne 0 ] || [ "$scanner_status" -ne 0 ]; then
            exit 1
          fi

      # Diagnostic only: captures the raw logs for post-mortem when either test step above
      # failed (a real test failure or a detected worker-start signature). Short, bounded
      # retention and a name unique to this run/attempt -- this is not release evidence to keep
      # around, only a debugging aid. `publish` never downloads this artifact.
      - name: Upload raw vitest logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-diagnostic-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/test-run.log
            ${{ runner.temp }}/test-coverage.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Verify checkout and packed retrieval parity
        run: npm run verify:pack-parity

      - name: Validate MCP Registry metadata
        run: npm run registry:validate

      - name: Verify release hygiene
        run: npm run release:verify

      # qualify:validate has two independent signals, not one, so absence can never silently
      # stay optional forever. check-qualification-gate.mjs compares docs/qualification/ (the
      # qualification *contract*, landing with #681) against whether package.json still
      # defines the qualify:validate script (the contract's *validator*), and fails closed if
      # the contract exists without its validator instead of downgrading to a notice. See that
      # script for the full decision table. Because both land together in #681, the very next
      # tag push that is an ancestor of that merge takes the hard-fail-when-missing branch
      # automatically -- no flag, no date, no follow-up PR to flip a switch.
      - name: Run qualification validation when available
        id: qualification
        shell: bash
        run: |
          set -euo pipefail
          decision="$(node .github/scripts/check-qualification-gate.mjs)"
          case "$decision" in
            decision=run)
              npm run qualify:validate
              echo 'status=passed' >> "$GITHUB_OUTPUT"
              ;;
            decision=notice)
              echo '::notice title=Qualification validation::qualify:validate is not present on this tag; qualification was skipped.'
              echo 'status=skipped (script not present)' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected qualification gate decision: $decision"
              exit 1
              ;;
          esac

      - name: Validate npm package contents
        run: npm pack --dry-run

      - name: Dry-run next publication
        run: npm publish --dry-run --tag next

      # This is the only tarball built for this release: `publish` downloads and ships exactly
      # this file. It is never rebuilt from source in a credentialed job.
      - name: Build release tarball and receipt
        id: pack
        shell: bash
        env:
          QUALIFICATION_STATUS: ${{ steps.qualification.outputs.status }}
        run: |
          set -euo pipefail
          npm pack --json > "$RUNNER_TEMP/npm-pack.json"
          tarball="$(node -e "console.log(require(process.argv[1])[0].filename)" "$RUNNER_TEMP/npm-pack.json")"
          size="$(node -e "console.log(require(process.argv[1])[0].size)" "$RUNNER_TEMP/npm-pack.json")"
          sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          lockfile_sha256="$(sha256sum package-lock.json | awk '{print $1}')"

          inspect_dir="$RUNNER_TEMP/tarball-inspect"
          mkdir -p "$inspect_dir"
          tar -xzf "$tarball" -C "$inspect_dir"
          INSPECT_DIR="$inspect_dir" node -e "
            const fs = require('fs');
            const path = require('path');
            const pkgPath = path.join(process.env.INSPECT_DIR, 'package', 'package.json');
            const pkg = require(pkgPath);
            if (pkg.name !== process.env.PACKAGE_NAME) throw new Error('packed name ' + pkg.name + ' does not match ' + process.env.PACKAGE_NAME);
            if (pkg.version !== process.env.PACKAGE_VERSION) throw new Error('packed version ' + pkg.version + ' does not match ' + process.env.PACKAGE_VERSION);
            const bin = pkg.bin;
            if (!bin || typeof bin !== 'object' || Object.keys(bin).length === 0) throw new Error('packed package.json has no bin entries');
            for (const [name, rel] of Object.entries(bin)) {
              const binPath = path.join(process.env.INSPECT_DIR, 'package', rel);
              if (!fs.existsSync(binPath)) throw new Error('CLI entry point for ' + name + ' is missing from the tarball: ' + rel);
            }
            console.log('packed package identity and CLI entry point verified');
          "

          artifact_dir="$RUNNER_TEMP/release-artifact"
          mkdir -p "$artifact_dir"
          cp "$tarball" "$artifact_dir/"
          printf '%s  %s\n' "$sha256" "$tarball" > "$artifact_dir/$tarball.sha256"

          RECEIPT_PATH="$artifact_dir/receipt.json" \
          TARBALL_NAME="$tarball" TARBALL_SHA256="$sha256" TARBALL_SIZE="$size" \
          LOCKFILE_SHA256="$lockfile_sha256" NPM_VERSION_OUT="$(npm --version)" \
          node -e "
            const fs = require('fs');
            fs.writeFileSync(process.env.RECEIPT_PATH, JSON.stringify({
              package: process.env.PACKAGE_NAME,
              version: process.env.PACKAGE_VERSION,
              tarball: process.env.TARBALL_NAME,
              tarballSha256: process.env.TARBALL_SHA256,
              tarballSizeBytes: Number(process.env.TARBALL_SIZE),
              sourceCommit: process.env.RELEASE_COMMIT,
              sourceTag: process.env.RELEASE_TAG,
              lockfileSha256: process.env.LOCKFILE_SHA256,
              nodeVersion: process.version,
              npmVersion: process.env.NPM_VERSION_OUT,
              qualificationStatus: process.env.QUALIFICATION_STATUS,
              generatedAt: new Date().toISOString(),
            }, null, 2))
          "

          artifact_name="release-tarball-${{ github.run_id }}-${{ github.run_attempt }}-${PACKAGE_VERSION}-${RELEASE_COMMIT}"
          {
            echo "tarball=$tarball"
            echo "sha256=$sha256"
            echo "artifact_dir=$artifact_dir"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      # Retention is deliberately short: this artifact is a pre-publish package tarball, useful
      # only to unblock a `publish`/`post_publish` rerun within the same release attempt. 14
      # days comfortably covers a stalled `npm-next` environment approval without retaining a
      # stale, unpublished package indefinitely.
      - name: Upload release tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ steps.pack.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 14

  # The only job with `id-token: write`. It never checks out the repository, never runs `npm
  # ci`, never runs tests or the build, and never executes a repository script -- it downloads
  # the exact artifact `validate` already built, tested, and packed, re-verifies it
  # independently, and publishes that file. `npm publish` is the last step in this job; nothing
  # runs after it.
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-next
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_NAME: '@lubab/madar'
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      TARBALL_NAME: ${{ needs.validate.outputs.tarball_name }}
      EXPECTED_TARBALL_SHA256: ${{ needs.validate.outputs.tarball_sha256 }}

    outputs:
      pre_publish_dist_tags: ${{ steps.capture-dist-tags.outputs.json }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pinned npm Trusted Publishing client
        run: npm install --global --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/npm-cli-bootstrap-cache" npm@12.0.2

      - name: Download validated release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: release-artifact

      - name: Verify downloaded artifact against the validate job's receipt
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifact
          test -f "$TARBALL_NAME"
          actual_sha256="$(sha256sum "$TARBALL_NAME" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_TARBALL_SHA256" ]]; then
            echo "::error::Downloaded tarball sha256 $actual_sha256 does not match validate output $EXPECTED_TARBALL_SHA256"
            exit 1
          fi
          sha256sum -c "$TARBALL_NAME.sha256"
          test -f receipt.json
          node -e "
            const receipt = require('./receipt.json');
            if (receipt.tarballSha256 !== process.env.EXPECTED_TARBALL_SHA256) throw new Error('receipt sha256 does not match');
            if (receipt.version !== process.env.PACKAGE_VERSION) throw new Error('receipt version does not match');
            if (receipt.sourceCommit !== process.env.RELEASE_COMMIT) throw new Error('receipt commit does not match');
            if (receipt.package !== process.env.PACKAGE_NAME) throw new Error('receipt package name does not match');
          "

      - name: Verify packed package identity and CLI entry point
        shell: bash
        run: |
          set -euo pipefail
          inspect_dir="$RUNNER_TEMP/tarball-inspect"
          mkdir -p "$inspect_dir"
          tar -xzf "release-artifact/$TARBALL_NAME" -C "$inspect_dir"
          INSPECT_DIR="$inspect_dir" node -e "
            const fs = require('fs');
            const path = require('path');
            const pkg = require(path.join(process.env.INSPECT_DIR, 'package', 'package.json'));
            if (pkg.name !== process.env.PACKAGE_NAME) throw new Error('packed name ' + pkg.name + ' does not match ' + process.env.PACKAGE_NAME);
            if (pkg.version !== process.env.PACKAGE_VERSION) throw new Error('packed version ' + pkg.version + ' does not match ' + process.env.PACKAGE_VERSION);
            const bin = pkg.bin;
            if (!bin || typeof bin !== 'object' || Object.keys(bin).length === 0) throw new Error('packed package.json has no bin entries');
            for (const [name, rel] of Object.entries(bin)) {
              const binPath = path.join(process.env.INSPECT_DIR, 'package', rel);
              if (!fs.existsSync(binPath)) throw new Error('CLI entry point for ' + name + ' is missing from the tarball: ' + rel);
            }
          "

      - name: Verify version is still unpublished
        shell: bash
        run: |
          set -euo pipefail
          npm view "$PACKAGE_NAME" versions --json > "$RUNNER_TEMP/npm-published-versions.json"
          node -e "
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const versions = typeof raw === 'string' ? [raw] : raw;
            if (versions.includes(process.env.PACKAGE_VERSION)) {
              throw new Error(process.env.PACKAGE_NAME + '@' + process.env.PACKAGE_VERSION + ' is already published; npm versions are immutable, so prepare a new prerelease number');
            }
          " "$RUNNER_TEMP/npm-published-versions.json"

      - name: Capture pre-publish npm dist-tags
        id: capture-dist-tags
        shell: bash
        run: |
          set -euo pipefail
          npm view "$PACKAGE_NAME" dist-tags --json > "$RUNNER_TEMP/npm-dist-tags-before.json"
          node -e "const tags = require(process.argv[1]); if (!tags || typeof tags !== 'object' || Array.isArray(tags)) throw new Error('npm returned invalid dist-tags JSON')" "$RUNNER_TEMP/npm-dist-tags-before.json"
          {
            echo "json<<DIST_TAGS_EOF"
            cat "$RUNNER_TEMP/npm-dist-tags-before.json"
            echo "DIST_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Require tokenless npm Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NODE_AUTH_TOKEN:-}" || -n "${NPM_TOKEN:-}" ]]; then
            echo '::error::Long-lived npm tokens are forbidden. Remove NODE_AUTH_TOKEN/NPM_TOKEN and configure npm Trusted Publishing for this GitHub environment.'
            exit 1
          fi

          user_config="$(npm config get userconfig)"
          global_config="$(npm config get globalconfig)"
          NPM_USER_CONFIG="$user_config" NPM_GLOBAL_CONFIG="$global_config" node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs'
          import { resolve } from 'node:path'

          const credentialEnvironmentKeys = Object.keys(process.env).filter((key) =>
            /^(?:NODE_AUTH_TOKEN|NPM_TOKEN)$/i.test(key)
              || /^NPM_CONFIG_.*(?:AUTH|TOKEN|PASSWORD)/i.test(key),
          )
          if (credentialEnvironmentKeys.length > 0) {
            throw new Error(`npm credential environment variables are forbidden: ${credentialEnvironmentKeys.join(', ')}`)
          }

          const configPaths = [
            resolve('.npmrc'),
            process.env.NPM_USER_CONFIG,
            process.env.NPM_GLOBAL_CONFIG,
          ].filter(Boolean)
          for (const configPath of configPaths) {
            if (existsSync(configPath) && /(?:_authToken|_auth|_password)\s*=/i.test(readFileSync(configPath, 'utf8'))) {
              throw new Error(`npm token credentials are forbidden in ${configPath}`)
            }
          }
          NODE

          npm_version="$(npm --version)"
          node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))); if (!supported) { console.error('npm ' + process.argv[1] + ' cannot use Trusted Publishing; npm >=11.5.1 is required'); process.exit(1) }" "$npm_version"
          if [[ "$(npm config get registry)" != 'https://registry.npmjs.org/' ]]; then
            echo '::error::Trusted Publishing must target https://registry.npmjs.org/.'
            exit 1
          fi

      # Final substantive step of this job. Nothing runs after it: a failure in post_publish
      # must never be "fixed" by publishing again, and keeping this step last makes that the
      # only way the workflow can be structured to behave.
      - name: Publish prerelease with npm Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          publish_log="$RUNNER_TEMP/npm-publish.log"
          if ! npm publish "release-artifact/$TARBALL_NAME" --tag next --access public --provenance >"$publish_log" 2>&1; then
            sed -E 's/(npm_[A-Za-z0-9]{20,}|Bearer[[:space:]]+[A-Za-z0-9._-]+)/[redacted]/g' "$publish_log" >&2
            echo '::error::Publication failed. Confirm the version is still unpublished and configure @lubab/madar Trusted Publishing for this GitHub repository, publish-next.yml, and the npm-next environment; do not add an npm token or remove provenance.'
            exit 1
          fi
          sed -E 's/(npm_[A-Za-z0-9]{20,}|Bearer[[:space:]]+[A-Za-z0-9._-]+)/[redacted]/g' "$publish_log"

  # Runs after a real publish. Holds `contents: write` to create the GitHub release, but no
  # `id-token` -- it cannot publish to npm, only verify what `publish` already shipped and
  # record it. Idempotent (create-or-edit), so rerunning this job after a failure never
  # republishes an immutable npm version; it only redoes verification and release bookkeeping.
  post_publish:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PACKAGE_NAME: '@lubab/madar'
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      QUALIFICATION_STATUS: ${{ needs.validate.outputs.qualification_status }}

    steps:
      # Checking out here is safe even though it wasn't safe in `publish`: this job holds no
      # `id-token`, so there is no npm publish credential in scope for a script to abuse, and
      # the ref is the commit `validate` already proved is the tag commit -- never
      # attacker-influenced input.
      - name: Check out validated prerelease commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Restore pre-publish npm dist-tags
        shell: bash
        env:
          PRE_PUBLISH_DIST_TAGS: ${{ needs.publish.outputs.pre_publish_dist_tags }}
        run: |
          set -euo pipefail
          printf '%s' "$PRE_PUBLISH_DIST_TAGS" > "$RUNNER_TEMP/npm-dist-tags-before.json"
          node -e "const tags = require(process.argv[1]); if (!tags || typeof tags !== 'object' || Array.isArray(tags)) throw new Error('pre-publish dist-tags passed from the publish job are not valid JSON')" "$RUNNER_TEMP/npm-dist-tags-before.json"

      - name: Verify published version and dist-tags
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for attempt in {1..12}; do
            if npm view "$PACKAGE_NAME" dist-tags --json > "$RUNNER_TEMP/npm-dist-tags-after.json" \
              && npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json > "$RUNNER_TEMP/npm-resolved-version.json" \
              && node .github/scripts/verify-next-release-state.mjs \
                --verify-publish \
                --version "$PACKAGE_VERSION" \
                --before "$RUNNER_TEMP/npm-dist-tags-before.json" \
                --after "$RUNNER_TEMP/npm-dist-tags-after.json" \
                --resolved-version "$RUNNER_TEMP/npm-resolved-version.json" >/dev/null 2>&1; then
              verified=true
              break
            fi
            echo "Waiting for npm registry propagation (attempt $attempt of 12)"
            sleep 10
          done

          if [[ "$verified" != true ]]; then
            node .github/scripts/verify-next-release-state.mjs \
              --verify-publish \
              --version "$PACKAGE_VERSION" \
              --before "$RUNNER_TEMP/npm-dist-tags-before.json" \
              --after "$RUNNER_TEMP/npm-dist-tags-after.json" \
              --resolved-version "$RUNNER_TEMP/npm-resolved-version.json"
            exit 1
          fi

          npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.integrity --json > "$RUNNER_TEMP/npm-integrity.json"
          integrity="$(node -p "require(process.argv[1])" "$RUNNER_TEMP/npm-integrity.json")"
          printf 'PACKAGE_INTEGRITY=%s\n' "$integrity" >> "$GITHUB_ENV"

      - name: Smoke-test exact and next global installs
        shell: bash
        run: |
          set -euo pipefail
          exact_prefix="$(mktemp -d "$RUNNER_TEMP/madar-exact-prefix.XXXXXX")"
          next_prefix="$(mktemp -d "$RUNNER_TEMP/madar-next-prefix.XXXXXX")"

          npm install --global --prefix "$exact_prefix" --cache "$RUNNER_TEMP/npm-smoke-cache-exact" --prefer-online "$PACKAGE_NAME@$PACKAGE_VERSION"
          npm install --global --prefix "$next_prefix" --cache "$RUNNER_TEMP/npm-smoke-cache-next" --prefer-online "$PACKAGE_NAME@next"

          exact_binary="$exact_prefix/bin/madar"
          next_binary="$next_prefix/bin/madar"
          [[ "$("$exact_binary" --version)" == "$PACKAGE_VERSION" ]]
          [[ "$("$next_binary" --version)" == "$PACKAGE_VERSION" ]]

          for channel in exact next; do
            workspace="$(mktemp -d "$RUNNER_TEMP/madar-$channel-workspace.XXXXXX")"
            mkdir -p "$workspace/src"
            printf '{"name":"madar-published-smoke","private":true,"type":"module"}\n' > "$workspace/package.json"
            printf 'export function greet(name: string): string { return `hello ${name}` }\n' > "$workspace/src/index.ts"

            if [[ "$channel" == exact ]]; then
              binary="$exact_binary"
            else
              binary="$next_binary"
            fi
            (cd "$workspace" && "$binary" generate . --no-html)
            test -s "$workspace/out/graph.json"
          done

      - name: Create or update GitHub prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_notes="$RUNNER_TEMP/github-prerelease-notes.md"
          RELEASE_NOTES_PATH="$release_notes" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'

          const {
            PACKAGE_INTEGRITY: integrity,
            PACKAGE_VERSION: version,
            QUALIFICATION_STATUS: qualification,
            RELEASE_COMMIT: commit,
            RELEASE_NOTES_PATH: notesPath,
          } = process.env
          const provenanceUrl = `https://www.npmjs.com/package/@lubab/madar/v/${version}#provenance`
          const body = [
            '## Prerelease publication',
            '',
            `- Version: \`${version}\``,
            `- Commit: \`${commit}\``,
            '- npm dist-tag: `next`',
            `- Install: \`npm install -g @lubab/madar@${version}\``,
            `- Provenance: ${provenanceUrl}`,
            `- Integrity: \`${integrity}\``,
            `- Qualification: ${qualification}`,
            '',
            '## Known limitations',
            '',
            'Path-sensitive checks that remain single-lane are follow-up work and are not cross-platform proof.',
            '',
            '## Rollback and remediation',
            '',
            'npm versions are immutable. If this prerelease is defective, deprecate the exact version, move `next` back to the last-known-good prerelease with `npm dist-tag add @lubab/madar@<last-known-good> next`, document the incident, and publish a new prerelease number. Do not move `latest` during prerelease remediation.',
            '',
          ].join('\n')
          writeFileSync(notesPath, body)
          NODE

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --target "$RELEASE_COMMIT" \
              --prerelease \
              --notes-file "$release_notes"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --target "$RELEASE_COMMIT" \
              --prerelease \
              --notes-file "$release_notes"
          fi
