name: Release

on:
  push:
    branches:
      - next
    paths:
      - package.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin provenance-capable npm
        run: npm install --global npm@12.0.1

      - name: Validate exact protected next tip, package version, and changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(node -pe 'require("./package.json").version')"
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/next"
          test "$GITHUB_REF_NAME" = "next"

          if [[ -z "$VERSION" || "$VERSION" == "undefined" ]]; then
            echo "package.json must contain a valid version field"
            exit 1
          fi

          if [[ "$VERSION" != "0.40.0-beta.6" ]]; then
            echo "This release candidate is authorized only for 0.40.0-beta.6"
            exit 1
          fi

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing a section for version $VERSION"
            exit 1
          fi

          git fetch --no-tags origin next
          NEXT_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$RELEASE_SHA" != "$NEXT_SHA" ]]; then
            echo "Release commit $RELEASE_SHA is not the exact next tip $NEXT_SHA"
            exit 1
          fi
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/branches/next" --jq '.protected')" != "true" ]]; then
            echo "The next branch must be protected before prerelease publication"
            exit 1
          fi

          TAG="v$VERSION"
          node .github/scripts/verify-forbidden-release-artifacts.mjs "$TAG"

      - name: Install dependencies
        run: npm ci

      - name: Verify release hygiene
        run: npm run release:verify

      - name: Validate MCP Registry metadata
        run: npm run registry:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build production and evaluation tooling
        run: |
          npm run build
          npm run build:eval

      - name: Verify baseline, packed parity, audit, and isolation
        run: |
          npx vitest run tests/unit/core-reset-baseline.test.ts
          npm run verify:pack-parity
          npm audit --audit-level=high
          npm audit signatures
          node tools/eval/core-reset/verify-isolation.mjs

      - name: Validate npm package contents
        run: npm pack --dry-run

      - name: Publish with npm Trusted Publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -pe 'require("./package.json").name')"
          VERSION="$(node -pe 'require("./package.json").version')"
          SPEC="$PACKAGE_NAME@$VERSION"
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          VIEW_STDERR="$(mktemp)"
          trap 'rm -f "$VIEW_STDERR"' EXIT

          verify_next_protection() {
            test "$(gh api "repos/$GITHUB_REPOSITORY/branches/next" --jq '.protected')" = "true"
          }

          verify_forbidden_release_artifacts_absent() {
            TAG="v$VERSION"
            node .github/scripts/verify-forbidden-release-artifacts.mjs "$TAG"
          }

          git fetch --no-tags origin next
          NEXT_SHA="$(git rev-parse FETCH_HEAD)"
          test "$RELEASE_SHA" = "$NEXT_SHA"
          verify_next_protection
          verify_forbidden_release_artifacts_absent

          if PUBLISHED_VERSION="$(npm view "$SPEC" version 2>"$VIEW_STDERR")"; then
            test "$PUBLISHED_VERSION" = "$VERSION"
            echo "$SPEC is already public; verifying the immutable artifact instead of republishing."
          else
            if ! grep -q 'E404' "$VIEW_STDERR"; then
              cat "$VIEW_STDERR" >&2
              exit 1
            fi

            git fetch --no-tags origin next
            NEXT_SHA="$(git rev-parse FETCH_HEAD)"
            test "$RELEASE_SHA" = "$NEXT_SHA"
            verify_next_protection
            verify_forbidden_release_artifacts_absent
            npm run publish:next
          fi

      - name: Verify npm artifact, dist-tags, provenance, and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -pe 'require("./package.json").name')"
          VERSION="$(node -pe 'require("./package.json").version')"
          SPEC="$PACKAGE_NAME@$VERSION"
          EXPECTED_SHASUM="4c98dd99cd321e741cabd689f0803d99e519f389"
          EXPECTED_INTEGRITY="sha512-o6L/BiJ1wrTWCaK537p60pGUC5i8zY0Zqz7NqD1zW4fJl/ewjF3cgysf4dbOkY4y49DkYDTG2qoUh1DGvq2Q0Q=="
          VERIFIED=false

          for attempt in 1 2 3 4 5 6; do
            PUBLISHED_VERSION="$(npm view "$SPEC" version 2>/dev/null || true)"
            NEXT_VERSION="$(npm view "$PACKAGE_NAME" dist-tags.next 2>/dev/null || true)"
            LATEST_VERSION="$(npm view "$PACKAGE_NAME" dist-tags.latest 2>/dev/null || true)"
            PUBLISHED_SHASUM="$(npm view "$SPEC" dist.shasum 2>/dev/null || true)"
            PUBLISHED_INTEGRITY="$(npm view "$SPEC" dist.integrity 2>/dev/null || true)"
            PROVENANCE="$(npm view "$SPEC" dist.attestations.provenance --json 2>/dev/null || true)"

            if [[ "$PUBLISHED_VERSION" == "$VERSION" \
              && "$NEXT_VERSION" == "$VERSION" \
              && "$LATEST_VERSION" == "0.32.0" \
              && "$PUBLISHED_SHASUM" == "$EXPECTED_SHASUM" \
              && "$PUBLISHED_INTEGRITY" == "$EXPECTED_INTEGRITY" \
              && -n "$PROVENANCE" \
              && "$PROVENANCE" != "null" ]]; then
              VERIFIED=true
              break
            fi

            sleep "$((attempt * 5))"
          done

          test "$VERIFIED" = true

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          (
            cd "$VERIFY_DIR"
            npm init --yes >/dev/null
            npm install --ignore-scripts "$SPEC"
            npm audit signatures
          )

          TAG="v$VERSION"
          node .github/scripts/verify-forbidden-release-artifacts.mjs "$TAG"

          {
            echo "Verified $SPEC from $GITHUB_SHA."
            echo "dist-tag next=$VERSION; latest=0.32.0."
            echo "shasum=$EXPECTED_SHASUM."
            echo "Trusted Publishing provenance and registry signatures passed; no tag or GitHub Release exists."
          } >> "$GITHUB_STEP_SUMMARY"
